<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>My Zoo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>

box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1812;--panel:#16291E;--ink:#E6EBDD;--muted:#9AA894;--accent:#E2A736;--line:#2A3B30;--card:#14221A;--hlbg:rgba(226,167,54,.22)}}
:root[data-theme="dark"]{--bg:#0E1812;--panel:#16291E;--ink:#E6EBDD;--muted:#9AA894;--accent:#E2A736;--line:#2A3B30;--card:#14221A;--hlbg:rgba(226,167,54,.22)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Atkinson Hyperlegible",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding-bottom:30px}
[hidden]{display:none!important}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;background:var(--panel);color:var(--panel-ink);padding:14px 16px}
.brand{font:800 19px "Bricolage Grotesque",system-ui,sans-serif}
h2{font:800 20px "Bricolage Grotesque",system-ui,sans-serif;margin:14px 0 4px}
h3{font:800 16px "Bricolage Grotesque",system-ui,sans-serif;color:var(--accent);margin:22px 0 0;padding-top:12px;border-top:1px solid var(--line)}
button{font:700 15px "Atkinson Hyperlegible",system-ui,sans-serif;border:2px solid var(--accent);background:var(--accent);color:#1b1405;border-radius:8px;padding:9px 14px;cursor:pointer}
button.ghost{background:transparent;color:var(--ink)}
.top button.ghost{color:var(--panel-ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* admin */
.card{background:var(--card);border:1px solid var(--line);margin:16px 16px 0;padding:16px}
.card h2{margin:0 0 8px;font-size:20px}
.list{margin:16px}
.hint,.mode{font-size:14px;color:var(--muted);margin:4px 0 10px}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px}
textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr;gap:6px}
@media(min-width:520px){.two{grid-template-columns:1fr 1fr}}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.item{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);padding:12px;margin-bottom:12px;break-inside:avoid}
.qr{background:#fff;padding:6px;flex:none;line-height:0;align-self:flex-start}
.qr img{display:none!important}
.info{min-width:0;flex:1}
.info b{font:800 19px "Bricolage Grotesque",system-ui,sans-serif}
.info i{display:block;color:var(--muted)}
.info small{display:block;color:var(--muted);word-break:break-all;margin:4px 0 8px;font-size:12px}
.info .row{margin-top:6px}.info button{padding:6px 10px;font-size:14px}
#msg{min-height:22px;margin:10px 0 0;font-weight:700}
.empty{color:var(--muted);padding:12px 0}
#foto_prev{max-width:200px;max-height:150px;border-radius:6px;border:1px solid var(--line);display:block}
/* halaman hewan */
.lang{display:flex}
.lang button{font-size:14px;border-radius:0;padding:4px 12px;background:transparent;color:var(--panel-ink)}
.lang button:first-child{border-radius:99px 0 0 99px}.lang button:last-child{border-radius:0 99px 99px 0;border-left:0}
.lang button[aria-pressed="true"]{background:var(--accent);color:#1b1405}
.hero{background:var(--panel);color:var(--panel-ink);padding:26px 20px 34px}
.hero h1{font:800 clamp(44px,15vw,100px)/.95 "Bricolage Grotesque",system-ui,sans-serif;margin:0;letter-spacing:-.02em;overflow-wrap:anywhere}
.sci{font-style:italic;font-size:19px;margin:12px 0 16px;opacity:.85}
.status{display:inline-block;background:var(--accent);color:#1b1405;font-weight:700;font-size:15px;padding:6px 14px;border-radius:4px}
.pic{background:linear-gradient(#E9B54C,#D08A22);overflow:hidden}
.pic img.foto{width:100%;max-height:340px;object-fit:cover;display:block}
.ph{width:110px;margin:26px auto;display:block}
.credit{margin:6px 20px 0;font-size:13px;color:var(--muted)}
.intro{padding:20px 20px 4px;font-size:19px;margin:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);margin:20px;border:1px solid var(--line)}
.stats div{background:var(--card);padding:14px}
.stats b{display:block;font:800 22px "Bricolage Grotesque",system-ui,sans-serif}
.stats span{font-size:14px;color:var(--muted)}
.stats.hl{background:var(--accent);outline:3px solid var(--accent);outline-offset:2px}
.sec{padding:6px 20px 14px}
.sec h2{margin:14px 0 4px}
.sec p{margin:0 0 10px;max-width:60ch}
details{border-top:1px solid var(--line);padding:12px 0}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{cursor:pointer;font-weight:700}
details p{margin:8px 0 0;color:var(--muted)}
.hl{background:var(--hlbg);box-shadow:-10px 0 0 var(--hlbg),10px 0 0 var(--hlbg);border-radius:4px}
#nar{display:flex;align-items:center;justify-content:center;width:calc(100% - 40px);min-height:54px;margin:16px 20px 0;font-size:18px;border-radius:12px;padding:12px 18px}
.nm{margin:8px 20px 0;font-size:14px;color:var(--muted)}
.quiz{padding:10px 20px 8px}
#qz-open{display:flex;justify-content:center;width:100%;min-height:54px;font-size:18px;background:var(--panel);color:var(--panel-ink);border:0;border-radius:12px;padding:12px 18px}
.qzbox{border:2px solid var(--accent);border-radius:14px;padding:16px;margin-top:14px;background:var(--card)}
.qp{margin:0;font-size:14px;color:var(--muted)}
.qh{font:800 clamp(24px,6vw,34px)/1.25 "Bricolage Grotesque",system-ui,sans-serif;margin:6px 0 4px;color:var(--ink);border:0;padding:0}
div.opt{display:flex;gap:12px;align-items:center;font:700 clamp(19px,4.6vw,26px) "Atkinson Hyperlegible",system-ui,sans-serif;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.opt b{flex:none;width:38px;height:38px;border-radius:50%;background:var(--accent);color:#1b1405;display:grid;place-items:center;font-size:20px}
.opt.ok{border-color:#2E7D32;background:rgba(46,125,50,.2)}
.opt.dim{opacity:.5}
.opt.hl{box-shadow:0 0 0 4px var(--accent)}
.qf{margin:10px 0 0;font-weight:700}
.qrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.qn{font-size:20px;padding:15px 28px}
.qg{background:transparent;color:var(--ink);border-color:var(--line);font-size:17px;padding:12px 18px}
#animal.fs{position:fixed;inset:0;overflow:auto;background:var(--bg);z-index:100;font-size:20px;padding-bottom:env(safe-area-inset-bottom,0px)}
#animal.fs>:not(.hero):not(.pic):not(.top){max-width:900px;margin-left:auto;margin-right:auto}
.lbtn{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 12px;font:800 22px "Bricolage Grotesque",system-ui,sans-serif}
.lbtn i{display:block;font:italic 400 15px "Atkinson Hyperlegible",system-ui,sans-serif;color:var(--muted)}
footer{padding:18px 20px 28px;font-size:13px;color:var(--muted);word-break:break-all}
@media print{.noprint,button{display:none!important}body{background:#fff;color:#000}.item{border:1px solid #999}}
.btn{display:inline-block;font:700 15px "Atkinson Hyperlegible",system-ui,sans-serif;border:2px solid var(--accent);border-radius:8px;padding:9px 14px;color:var(--panel-ink);text-decoration:none;background:transparent}
a.lbtn{text-decoration:none}
</style>
</head>
<body>
<main>
<p id="boot" style="padding:28px 20px;text-align:center;font-size:18px">Memuat…</p>
<div id="landing" hidden>
<div class="top"><span class="brand">My Zoo</span><div class="lang"><button data-l="id" aria-pressed="true">ID</button><button data-l="en" aria-pressed="false">EN</button></div></div>
<div class="hero"><h1 id="l_t"></h1><p class="sci" id="l_s"></p></div>
<div class="list" id="l_list"></div>
</div>

<div id="animal" hidden>
<div class="top"><a id="back" class="btn" href="#"></a><button id="fs" class="ghost" type="button"></button><div class="lang"><button data-l="id" aria-pressed="true">ID</button><button data-l="en" aria-pressed="false">EN</button></div></div>

</div>
</main>

/* ---------- sumber data: Google Sheet yang dipublikasikan sebagai CSV ---------- */
var CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vTH7skfBdVJt51X87PYMUaip-BQhEazaypzd1LtJa-q4h8mH77rnoiaMqaz1J1-pOj4KCBm66lVoCjq/pub?gid=246258816&single=true&output=csv";
function parseCSV(t){var rows=[],r=[],f="",q=false,i=0,c;t=t.replace(/^\uFEFF/,"");
for(;i<t.length;i++){c=t.charAt(i);
if(q){if(c==='"'){if(t.charAt(i+1)==='"'){f+='"';i++}else q=false}else f+=c}
else if(c==='"')q=true;else if(c===","){r.push(f);f=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&t.charAt(i+1)==="\n")i++;r.push(f);f="";rows.push(r);r=[]}else f+=c}
if(f!==""||r.length){r.push(f);rows.push(r)}
var h=rows.shift()||[];return rows.filter(function(x){return x.length>1||x[0]}).map(function(x){var o={};h.forEach(function(k,j){o[k]=x[j]==null?"":x[j]});return o})}
function start(rows){var l=rows.filter(function(r){return r.id});
BOOT.list=l.map(function(a){return{id:a.id,ilmiah:a.ilmiah,nama_id:a.nama_id,nama_en:a.nama_en}});
BOOT.animal=BOOT.id?(l.filter(function(r){return r.id===BOOT.id})[0]||null):null;
$("boot").hidden=true;if(BOOT.id){$("animal").hidden=false;renderA()}else{$("landing").hidden=false;renderL()}}
(function load(){
if(CSV_URL.indexOf("http")!==0){$("boot").textContent="Alamat data (CSV_URL) belum diisi di file index.html.";return}
var cached=null;try{cached=localStorage.getItem("zoo_csv")}catch(e){}
if(cached){try{start(parseCSV(cached))}catch(e){}}
fetch(CSV_URL).then(function(r){if(!r.ok)throw new Error(r.status);return r.text()}).then(function(t){
if(t===cached)return;try{localStorage.setItem("zoo_csv",t)}catch(e){}start(parseCSV(t))
}).catch(function(){if(!cached){$("boot").hidden=false;$("boot").textContent="Tidak bisa memuat data. Periksa sinyal lalu muat ulang halaman."}})})();
</script>
